name: Aider AI Code Assistant

# Temporarily parked: do not run automated coding agents while CI is being stabilized.
# Restore the issue_comment trigger after Android CI error rate improves.
on:
  workflow_dispatch:

jobs:
  aider:
    name: Run Aider
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: aider-chat-action
        uses: mirrajabi/aider-github-action@v1.1.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          auto_commit: true
