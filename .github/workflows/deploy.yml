# GitHub Pages deployment is handled by android-ci.yml after a successful APK build.
# Keep this workflow available for manual use without allowing it to overwrite
# the automatically published APK on normal pushes.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy repository files
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
