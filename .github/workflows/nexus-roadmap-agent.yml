name: Nexus Roadmap Auto Execution

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Roadmap phase to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - phase1
          - phase2
          - phase3
          - phase4
          - phase5
          - phase6
          - phase7
      auto_fix_attempts:
        description: Maximum repair passes per phase
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nexus-roadmap-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  roadmap:
    name: Execute Nexus Roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Verify roadmap source
        run: test -f docs/NEXUS_FEATURE_ARCHITECTURE_AND_HISTORY.md

      - name: Phase 1 - Nexus Foundation
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read docs/NEXUS_FEATURE_ARCHITECTURE_AND_HISTORY.md and the existing repository. Execute Phase 1 Nexus Foundation completely and conservatively: preserve working features, improve the current Nexus Android foundation, remove placeholders only where the roadmap calls for it, keep English-first repository conventions and Traditional Chinese/Bahasa Melayu app language support. Run relevant Gradle tests/lint and fix problems you introduce. Do not add secrets or unsafe Android capabilities. Commit the completed changes."

      - name: Phase 1 verification
        id: phase1_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase1' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase1-ci.log

      - name: Phase 1 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase1') && steps.phase1_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase1-ci.log. Diagnose the actual failure, fix the root cause, rerun the relevant Gradle checks, and commit only the necessary repair. Keep the roadmap intent and existing working behavior."

      - name: Phase 1 final verification
        id: phase1_final
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase1' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Phase 2 - Real Agent
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase2' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read the roadmap and execute Phase 2 Real Agent completely: strengthen intent detection, task decomposition, Planner, Tool/Skill selection, model provider routing, execution, observation, verification, retry/recovery, re-planning where practical, and user confirmation/waiting states. Preserve current Agent Task UI and working tools. Run Gradle tests/lint, add focused tests, fix problems, and commit the changes. Do not invent unsupported integrations."

      - name: Phase 2 verification
        id: phase2_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase2' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase2-ci.log

      - name: Phase 2 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase2') && steps.phase2_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase2-ci.log. Diagnose the actual failure, fix the root cause, rerun relevant Gradle checks, and commit only the necessary repair. Keep Agent Core behavior safe and deterministic when cloud providers are unavailable."

      - name: Phase 2 final verification
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase2' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Phase 3 - Mobile Agent
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase3' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read the roadmap and execute Phase 3 Mobile Agent: build the phone-first File Agent, App Agent, Web Research foundations, and notification/system integration only through official Android APIs and explicit user permissions. Preserve no-root requirements, SAF, Intent, deep links, and safe permission boundaries. Add tests and clear failure handling. Run Gradle tests/lint, fix problems, and commit. Never bypass permissions, CAPTCHAs, paywalls, security controls, or private Android APIs."

      - name: Phase 3 verification
        id: phase3_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase3' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase3-ci.log

      - name: Phase 3 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase3') && steps.phase3_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase3-ci.log. Diagnose the actual failure, fix the root cause, rerun relevant Gradle checks, and commit only the necessary repair. Keep Android permission and no-root safety boundaries intact."

      - name: Phase 3 final verification
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase3' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Phase 4 - Skills and Memory
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase4' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read the roadmap and execute Phase 4 Skills + Memory completely: mature Skill Registry and SKILL.md import/provenance/security checks, and layered Agent Memory using the existing Room foundation. Keep private memory local by default, require explicit consent for external sharing, preserve license/provenance metadata, and prevent arbitrary skills from gaining high Android privileges. Add focused tests. Run Gradle tests/lint, fix problems, and commit."

      - name: Phase 4 verification
        id: phase4_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase4' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase4-ci.log

      - name: Phase 4 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase4') && steps.phase4_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase4-ci.log. Diagnose the actual failure, fix the root cause, rerun relevant Gradle checks, and commit only the necessary repair. Preserve skill provenance/security and local-memory privacy."

      - name: Phase 4 final verification
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase4' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Phase 5 - Web Office GitHub
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase5' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read the roadmap and execute Phase 5 Web/Office/GitHub: mature Web Research, Nexus Agent Studio/Workflow Studio foundations, GitHub repository/branch/files/issues/PRs/Actions workflows, and safe Office automation boundaries. Use official APIs, least privilege, explicit confirmation for writes, and untrusted-content validation. Preserve existing GitHub CI/CD. Add tests. Run Gradle tests/lint, fix problems, and commit."

      - name: Phase 5 verification
        id: phase5_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase5' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase5-ci.log

      - name: Phase 5 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase5') && steps.phase5_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase5-ci.log. Diagnose the actual failure, fix the root cause, rerun relevant Gradle checks, and commit only the necessary repair. Do not weaken authentication, authorization, or write-confirmation safeguards."

      - name: Phase 5 final verification
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase5' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Phase 6 - AI Moments and AI 朋友圈
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase6' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read the roadmap and execute Phase 6 AI Moments and AI 朋友圈 foundations: build private Agent activity/moment records and optional public sharing/feed concepts with a strict separation between private Memory and public content. Never expose chats, files, or memories automatically. Add tests and privacy-aware UI/data models. Run Gradle tests/lint, fix problems, and commit."

      - name: Phase 6 verification
        id: phase6_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase6' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase6-ci.log

      - name: Phase 6 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase6') && steps.phase6_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase6-ci.log. Diagnose the actual failure, fix the root cause, rerun relevant Gradle checks, and commit only the necessary repair. Preserve the private-memory/public-feed boundary."

      - name: Phase 6 final verification
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase6' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Phase 7 - Voice and Advanced Agent
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase7' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read the roadmap and execute Phase 7 advanced capabilities: integrate Voice as another Agent input/output path (Speech-to-Text, AI response, Text-to-Speech) and mature deeper Android integration, multi-model/local asset architecture, and agent collaboration foundations where supported by the current repository. Keep phone-only/no-root boundaries, explicit permissions, privacy, and graceful fallback. Add tests. Run Gradle tests/lint, fix problems, and commit. Do not embed large local models into the core APK."

      - name: Phase 7 verification
        id: phase7_test
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase7' }}
        continue-on-error: true
        run: ./gradlew test lint --no-daemon --stacktrace 2>&1 | tee phase7-ci.log

      - name: Phase 7 repair
        if: ${{ (inputs.phase == 'all' || inputs.phase == 'phase7') && steps.phase7_test.outcome == 'failure' && inputs.auto_fix_attempts != '1' }}
        uses: mirrajabi/aider-github-action@v1.1.0
        with:
          api_key_env_name: GEMINI_API_KEY
          api_key_env_value: ${{ secrets.GEMINI_API_KEY }}
          model: gemini/gemini-2.5-flash
          branch: ${{ github.ref_name }}
          aider_args: >-
            --yes --message "Read phase7-ci.log. Diagnose the actual failure, fix the root cause, rerun relevant Gradle checks, and commit only the necessary repair. Preserve no-root, permission, privacy, and fallback safeguards."

      - name: Phase 7 final verification
        if: ${{ inputs.phase == 'all' || inputs.phase == 'phase7' }}
        run: ./gradlew test lint --no-daemon --stacktrace

      - name: Roadmap execution summary
        run: |
          echo "Nexus roadmap execution completed for: ${{ inputs.phase }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Auto-fix passes requested: ${{ inputs.auto_fix_attempts }}"
          git status --short
          git log -5 --oneline
