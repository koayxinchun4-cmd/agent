name: Security

# Temporarily parked: Android CI is the only automatic CI gate while reliability errors are reduced.
# Restore push / pull_request / schedule triggers after Android CI stability improves.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Kotlin analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Create local environment file
        run: printf 'GEMINI_API_KEY=%s\n' "${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build for CodeQL
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
