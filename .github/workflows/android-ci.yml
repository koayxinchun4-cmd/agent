name: Android CI/CD

on:
  push:
      branches: [ "main", "master", "develop" ]
        pull_request:
            branches: [ "main", "master" ]
              workflow_dispatch:

              jobs:
                build-and-test:
                    name: Build, Lint & Test
                        runs-on: ubuntu-latest

                            steps:
                                  - name: Checkout repository
                                          uses: actions/checkout@v4

                                                - name: Set up JDK 17
                                                        uses: actions/setup-java@v4
                                                                with:
                                                                          distribution: 'temurin'
                                                                                    java-version: '17'
                                                                                              cache: gradle

                                                                                                    - name: Setup Android SDK
                                                                                                            uses: android-actions/setup-android@v3

                                                                                                                  - name: Accept Android SDK Licenses & Install Components
                                                                                                                          run: |
                                                                                                                                    yes | sdkmanager --licenses || true
                                                                                                                                              sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

                                                                                                                                                    - name: Grant execute permission for gradlew
                                                                                                                                                            run: chmod +x gradlew

                                                                                                                                                                  - name: Restore Debug Keystore
                                                                                                                                                                          run: |
                                                                                                                                                                                    if [ -f "debug.keystore.base64" ]; then
                                                                                                                                                                                                echo "Restoring debug.keystore from debug.keystore.base64..."
                                                                                                                                                                                                            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore
                                                                                                                                                                                                                      fi
                                                                                                                                                                                                                                if [ ! -f "debug.keystore" ]; then
                                                                                                                                                                                                                                            echo "Generating new debug.keystore..."
                                                                                                                                                                                                                                                        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                            cp debug.keystore app/debug.keystore 2>/dev/null || true

                                                                                                                                                                                                                                                                                  - name: Setup Environment Secrets
                                                                                                                                                                                                                                                                                          env:
                                                                                                                                                                                                                                                                                                    OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                                                                                                                                                                                                                                                                                                              GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                if [ -f ".env.example" ] && [ ! -f ".env" ]; then
                                                                                                                                                                                                                                                                                                                                            cp .env.example .env
                                                                                                                                                                                                                                                                                                                                                      elif [ ! -f ".env" ]; then
                                                                                                                                                                                                                                                                                                                                                                  touch .env
                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                      echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env
                                                                                                                                                                                                                                                                                                                                                                                                echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
                                                                                                                                                                                                                                                                                                                                                                                                          cp .env app/.env 2>/dev/null || true

                                                                                                                                                                                                                                                                                                                                                                                                                - name: Setup Gradle
                                                                                                                                                                                                                                                                                                                                                                                                                        uses: gradle/actions/setup-gradle@v4

                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Build Debug APK
                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                ./gradlew assembleDebug --no-daemon --stacktrace

                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Create Test Output Directories
                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        mkdir -p app/src/test/screenshots
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mkdir -p src/test/screenshots

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: Run Unit Tests
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ./gradlew testDebugUnitTest --no-daemon --stacktrace

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Upload Debug APK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  name: nexus-agent-debug-apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            path: app/build/outputs/apk/debug/app-debug.apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if-no-files-found: error
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                retention-days: 7

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Upload Test Reports
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if: always()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        name: junit-test-reports
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  path: app/build/reports/tests/testDebugUnitTest/
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if-no-files-found: ignore
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      retention-days: 7
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      