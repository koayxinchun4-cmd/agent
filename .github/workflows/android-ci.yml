name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Create .env file with GitHub Secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK for GitHub Pages
        run: |
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/app-debug.apk
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Agent APK</title>
          </head>
          <body>
            <h1>Agent APK</h1>
            <p><a href="./app-debug.apk">Download app-debug.apk</a></p>
          </body>
          </html>
          EOF

      - name: Publish APK to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public

      - name: Calculate semantic version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"

          if [[ -z "$latest_tag" ]]; then
            version="1.0.0"
          else
            if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag '$latest_tag' is not a valid semantic version (vMAJOR.MINOR.PATCH)."
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            message="${{ github.event.head_commit.message }}"

            if [[ "$message" =~ BREAKING[[:space:]]CHANGE ]] || [[ "$message" =~ ^[^:]+!:\ |^.*!:[[:space:]] ]]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [[ "$message" =~ ^feat(\(.+\))?:[[:space:]] ]]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            version="${major}.${minor}.${patch}"
          fi

          echo "version=v${version}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${version}"

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Agent $TAG_NAME" \
            --generate-notes
