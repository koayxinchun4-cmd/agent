name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Create local environment file
        run: printf 'GEMINI_API_KEY=%s\n' "${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Calculate semantic version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            latest_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [[ -z "$latest_tag" ]]; then
              version="v1.0.0"
            else
              if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Latest release tag '$latest_tag' is not a valid semantic version (vMAJOR.MINOR.PATCH)."
                exit 1
              fi
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch=$((BASH_REMATCH[3] + 1))
              version="v${major}.${minor}.${patch}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release: ${version}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare GitHub Pages content
        run: |
          set -euo pipefail
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/app-debug.apk
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Nexus APK</title>
          </head>
          <body>
            <h1>Nexus APK</h1>
            <p>Latest debug APK for testing.</p>
            <p><a href="./app-debug.apk">Download app-debug.apk</a></p>
          </body>
          </html>
          EOF

      - name: Publish APK to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Nexus $TAG_NAME" \
            --generate-notes