name: Repository Hygiene

# Temporarily parked: keep Android CI as the only automatic workflow while stabilizing failures.
# Restore push / pull_request triggers after CI error rate improves.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check tracked generated files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run repository hygiene guard
        run: bash scripts/check-repo-hygiene.sh
